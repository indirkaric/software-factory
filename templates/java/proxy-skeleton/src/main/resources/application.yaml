server:
  port: {{port}}

spring-doc:
  swagger-ui:
    doc-expansion: none
    operationsSorter: alpha
    tagsSorter: alpha

spring:
  application:
    name: {{service-name}}
  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: http://auth.factory.local:8080/realms/factory

# One entry per downstream service, added by the bootstrapper:
#   <name>:
#     base-uri: "http://<name>.factory.local:<port>/<prefix>/"
client: {}

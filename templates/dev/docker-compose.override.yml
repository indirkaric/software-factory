# Ports on the host, so services started from an IDE (and the factory's local check) reach
# the infrastructure. Change them in .env (DB_PORT, AUTH_PORT, AWS_PORT) when another stack
# already uses the defaults; nothing else needs to change.
services:
  db:
    ports: ["${DB_PORT:-5432}:5432"]
  auth:
    ports: ["${AUTH_PORT:-8080}:8080"]
  aws:
    ports: ["${AWS_PORT:-4566}:4566"]
  azurite:
    ports: ["10000:10000", "10001:10001", "10002:10002"]
  redis:
    ports: ["${REDIS_PORT:-6379}:6379"]
